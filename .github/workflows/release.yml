# Builds the Windows installer for a version tag, runs the release checks,
# creates a build-provenance attestation for the exact installer file and
# attaches installer and checksums to a draft release. Publishing the draft is
# done by hand.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Check that the tag matches package.json
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          if ($pkg.version -ne $tag) { throw "Tag $tag does not match package.json version $($pkg.version)" }

      - name: Install pinned dependencies
        run: npm ci

      - name: Fetch and verify the toolchain parts
        run: node scripts/fetch-toolchain-parts.mjs

      - name: Type check
        run: npm run typecheck

      - name: Tests, including the release checks (transaction correctness and approval integrity)
        run: npx vitest run --reporter=default --reporter=json --outputFile=test-results.json

      - name: Release check report
        shell: pwsh
        run: node scripts/gate-report.mjs test-results.json >> $env:GITHUB_STEP_SUMMARY

      - name: Packaging check (no test-only package in the app)
        run: node scripts/packaging-check.mjs --before-build

      - name: Build the installer
        env:
          WAXMASTER_RELEASE_MAINNET: '1'
        run: npm run dist

      - name: Packaging check of the built app
        run: node scripts/packaging-check.mjs dist/win-unpacked

      - name: Write SHA256SUMS.txt
        shell: pwsh
        run: |
          $files = Get-ChildItem dist -Filter 'WAX-Master-Setup-*.exe'
          $lines = $files | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" }
          Set-Content -Path dist/SHA256SUMS.txt -Value $lines -Encoding ascii
          Get-Content dist/SHA256SUMS.txt

      - name: Attest the installer
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/WAX-Master-Setup-*.exe'

      - name: Verify the attestation
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $f = (Get-ChildItem dist -Filter 'WAX-Master-Setup-*.exe').FullName
          gh attestation verify $f -R ${{ github.repository }}
          if ($LASTEXITCODE -ne 0) { throw 'Attestation check failed' }

      - name: Create the draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $f = (Get-ChildItem dist -Filter 'WAX-Master-Setup-*.exe').FullName
          $pre = if ('${{ github.ref_name }}' -match '-') { '--prerelease' } else { '' }
          gh release create '${{ github.ref_name }}' $f dist/SHA256SUMS.txt --draft $pre --title 'WAX Master ${{ github.ref_name }}' --notes-file docs/release-notes-template.md -R ${{ github.repository }}
