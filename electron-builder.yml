appId: io.github.gulkonster.waxmaster
productName: WAX Master
copyright: Copyright (c) gulkonster and contributors
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
  - '!node_modules/**'
  - node_modules/@noble/**
  - node_modules/node-pty/package.json
  - node_modules/node-pty/lib/**
  - node_modules/node-pty/prebuilds/win32-x64/**
  - '!node_modules/node-pty/**/*.test.js'
  - '!node_modules/node-pty/**/*.map'
  - '!node_modules/node-pty/**/*.pdb'
asar: true
npmRebuild: false
buildDependenciesFromSource: false
asarUnpack:
  - node_modules/node-pty/lib/**
  - node_modules/node-pty/prebuilds/win32-x64/**
  - node_modules/node-pty/package.json
extraResources:
  - from: resources
    to: resources
    filter:
      - 'templates/**'
      - 'local-chain/**'
  - from: docs/help
    to: resources/docs
    filter:
      - '*.md'
      - index.json
      - search-words.json
  - from: build/icon.ico
    to: icon.ico
  - from: LICENSE
    to: LICENSE.txt
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
  - from: toolchain-parts
    to: toolchain-parts
    filter:
      - '*.deb'
      - '*.tar.gz'
afterPack: scripts/after-pack.cjs
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  executableName: WAX Master
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  packElevateHelper: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: WAX Master
  artifactName: WAX-Master-Setup-${version}.exe
  uninstallDisplayName: WAX Master
  deleteAppDataOnUninstall: false
  include: build/installer.nsh
publish: null
